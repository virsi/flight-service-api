# Развертывание объектного хранилища MinIO для лабораторной №1.
# После запуска создать публичный бакет «flight-media» и загрузить в него
# изображения и видео ресурсов (ключи на латинице, см. repository.go).
services:
  minio:
    container_name: minio_storage
    image: minio/minio:latest
    ports:
      - "9100:9000"   # S3 API (отсюда берутся ссылки на файлы; 9000 на хосте занят)
      - "9101:9001"   # веб-консоль MinIO
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}  # берём из .env (см. .env.example)
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  postgres:
    container_name: flight_postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: flight_service_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  adminer:
    container_name: flight_adminer
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
  postgres-data:
