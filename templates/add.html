<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обслуживание рейса — добавление</title>
  <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Добавление</h1>
      <p class="subtitle">Черновик новой услуги</p>
    </header>

    <div class="form">
      {{ if .flightService }}
      <form action="/flight-publish" method="POST">
        <p class="section-title">Изображение</p>
        <div class="upload">
          {{ if .flightService.ImageURL }}
          <img src="{{ .flightService.ImageURL }}" alt="{{ .flightService.Name }}">
          {{ else }}
          <img src="/static/media/default.jpg" alt="{{ .flightService.Name }}">
          {{ end }}
        </div>

        <p class="section-title">Видео</p>
        <div class="upload">
          {{ if .flightService.VideoURL }}
          <video src="{{ .flightService.VideoURL }}" controls></video>
          {{ else }}
          <video src="/static/media/default.mp4" controls></video>
          {{ end }}
        </div>

        <p class="section-title">Текст</p>
        <div class="field">
          <label>Название</label>
          <input type="text" value="{{ .flightService.Name }}" readonly>
        </div>
        <div class="field">
          <label>Краткое описание</label>
          <input type="text" name="description" value="{{ .flightService.Description }}" required>
        </div>

        <p class="section-title">Параметры</p>
        <div class="field-row">
          <div class="field">
            <label>Единица измерения</label>
            <input type="text" name="unit" value="{{ .flightService.Unit }}" required>
          </div>
          <div class="field">
            <label>Цена</label>
            <input type="number" step="0.01" name="price" value="{{ .flightService.Price }}" required>
          </div>
        </div>

        <button type="submit" class="btn-primary">Опубликовать</button>
      </form>
      {{ else }}
      <form action="/flight-draft" method="POST">
        <p class="section-title">Изображение</p>
        <div class="field">
          <label>Фото</label>
          <input type="file" accept="image/*">
        </div>

        <p class="section-title">Видео</p>
        <div class="field">
          <label>Видео</label>
          <input type="file" accept="video/*">
        </div>

        <p class="section-title">Текст</p>
        <div class="field">
          <label>Название</label>
          <input type="text" name="name" required>
        </div>

        <button type="submit" class="btn-primary">Далее</button>
      </form>
      {{ end }}
    </div>

    <nav class="tabbar">
      <a href="/flight-feed" class="tab"><span class="icon">▶</span><span class="label">Лента</span><span class="underline"></span></a>
      <a href="/flight-draft" class="tab active"><span class="icon">+</span><span class="label">Добавление</span><span class="underline"></span></a>
      <a href="/flight-resources" class="tab"><span class="icon">▦</span><span class="label">Плитка</span><span class="underline"></span></a>
    </nav>
  </div>
</body>
</html>
