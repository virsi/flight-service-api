<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обслуживание рейса — лента</title>
  <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
  <div class="app app-feed">
    {{ if .flightService.Video }}
    <video class="feed-video" src="{{ media .flightService.Video }}" autoplay muted loop playsinline></video>
    {{ else }}
    <video class="feed-video" src="/static/media/default.mp4" autoplay muted loop playsinline></video>
    {{ end }}

    <div class="feed-overlay">
      <header class="feed-header">
        <h1>Обслуживание рейса</h1>
        <p class="subtitle">Рейс SU-123 · 12:30</p>
      </header>

      <div class="feed-content">
        <div class="feed-actions">
          <div class="like-group">
            <button class="btn-like" type="button">♥</button>
            <span class="likes-count">{{ .likesCount }}</span>
          </div>
          <a class="btn-next" href="/flight-feed?id={{ .flightService.ID }}&next=true">→</a>
        </div>
        <h2 class="feed-name">{{ .flightService.Name }}</h2>
        <div class="feed-desc-wrap">
          <input type="checkbox" id="desc-more" class="desc-toggle">
          <p class="feed-desc">{{ .flightService.Description }}</p>
          <label for="desc-more" class="more">Ещё</label>
        </div>
        <p class="feed-price">{{ .flightService.Price }} ₽/{{ .flightService.Unit }}</p>
      </div>
    </div>

    <nav class="tabbar">
      <a href="/flight-feed" class="tab active"><span class="icon">▶</span><span class="label">Лента</span><span class="underline"></span></a>
      <a href="/flight-draft" class="tab"><span class="icon">+</span><span class="label">Добавление</span><span class="underline"></span></a>
      <a href="/flight-resources" class="tab"><span class="icon">▦</span><span class="label">Плитка</span><span class="underline"></span></a>
    </nav>
  </div>
</body>
</html>
